version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
      nodejs: 18
    commands:
      - java -version
      - mvn -version

  pre_build:
    commands:
      - echo "Installing frontend dependencies..."
      - cd frontend && npm ci && cd ..

  build:
    commands:
      - echo "Building frontend..."
      - cd frontend && npm run build && cd ..
      - echo "Building backend..."
      - cd backend && mvn clean package -DskipTests && cd ..

  post_build:
    commands:
      - echo "Build complete"

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - backend/target/*.jar
    - frontend/dist/**/*
  discard-paths: no
