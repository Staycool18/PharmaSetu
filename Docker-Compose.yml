version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: medic
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
    networks:
      - pharmasetu-net

  backend:
    image: staycool18/pharmasetu-backend:latest
    container_name: backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medic
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - pharmasetu-net

  frontend:
    image: staycool18/pharmasetu-frontend:latest
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - pharmasetu-net

networks:
  pharmasetu-net:
    driver: bridge

volumes:
  mysql_data:
