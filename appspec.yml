version: 0.0
os: linux

files:
  - source: backend/target/
    destination: /opt/pharmasetu/backend
  - source: frontend/dist/
    destination: /var/www/pharmasetu

permissions:
  - object: /opt/pharmasetu
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - directory
      - file
  - object: /var/www/pharmasetu
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - directory
      - file
  - object: scripts/before_install.sh
    mode: 755
    type:
      - file
  - object: scripts/after_install.sh
    mode: 755
    type:
      - file
  - object: scripts/start.sh
    mode: 755
    type:
      - file
  - object: scripts/validate_service.sh
    mode: 755
    type:
      - file

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 120
      runas: root
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 90
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 60
      runas: root
